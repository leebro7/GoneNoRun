name: Build Check

# 触发条件：push 到 master / 任意来源的 pull_request / 手动触发
#
# 零信任要点：
#   * 本 workflow 不读取任何 Secret，因此 fork PR 与同仓库分支 PR 都不存在
#     凭据外泄面（历史版本在此处注入了 MAPS_API_KEY，属真实缺陷）。
#   * 所有 Action 固定到 commit SHA。
#   * 顶层权限只读。
on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 配置与供应链校验（不需要 Android SDK）
  # ---------------------------------------------------------------------------
  policy-check:
    name: Workflow Policy Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Enforce zero-trust workflow policy
        run: node scripts/check-workflow-policy.mjs

      - name: Verify vendored dependency checksums
        working-directory: app/libs
        run: sha256sum -c VENDORED_DEPENDENCIES.sha256

  # ---------------------------------------------------------------------------
  # 密钥泄露扫描（覆盖全历史）
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0          # 密钥扫描必须覆盖历史提交
          persist-credentials: false

      # 直接取官方二进制并校验 SHA-256（值取自该 release 的 asset digest），
      # 避免为此引入第三方 Action
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Run gitleaks over full history
        run: |
          ./gitleaks detect --source . --log-opts="--all" \
            --config .gitleaks.toml --redact --verbose

  # ---------------------------------------------------------------------------
  # 构建（不使用任何 Secret，可安全面向 fork PR 运行）
  # ---------------------------------------------------------------------------
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@9704b39bf258b59bc04b50fa2dd55e9ed76b47a8 # v4.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 此处刻意不注入 MAPS_API_KEY：无 Key 时地图功能不可用，
      # 但编译与静态检查正常，且 PR 构建不接触任何凭据。
      # secrets-gradle-plugin 在 local.properties 缺失时会让项目配置阶段失败：
      #   The file .../local.properties could not be found
      # 无密钥构建（PR、fork、手动构建）因此全部失败。这里写入空值占位；
      # 地图功能不可用，但编译与打包正常。local.properties 已在 .gitignore 中。
      - name: Provide empty local.properties (no secrets)
        run: |
          if [ ! -f local.properties ]; then
            printf "MAPS_API_KEY=\nMAPS_SAFE_CODE=\n" > local.properties
          fi
          echo "local.properties present (placeholder values)"
      - name: Verify vendored dependencies
        run: ./gradlew verifyVendoredDependencies

      - name: Build debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
