name: Build Release

# 触发条件：
#   - 手动触发
#   - 推送 v* 形式的 tag（不再使用 '*' 通配，避免任意 tag 触发发布）
#
# 零信任要点（对应审计发现 F-02 / F-03）：
#   1. 发布作业绑定 GitHub Environment（production），须经人工审批才会执行，
#      未批准时签名凭据不会被注入。
#   2. 顶层权限只读；写权限仅下沉到 publish 作业。
#   3. 所有 Action 固定到 commit SHA。
#   4. 签名由 Gradle 一次完成，不再「先用仓库内 keystore 签一次、再由第三方
#      Action 签一次」（历史版本的双重签名反模式）。
#   5. 生成 SHA-256 校验值并写入 Release 正文，供客户端自更新强制校验。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（留空则按 v<versionName> 自动推导）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 构建并签名。
  #
  # 该作业持有签名凭据。凭据来自名为 production 的 Environment Secret —— 
  # Environment 提供审批闸门：未获批准时本作业不会启动，凭据也不会被注入。
  # 注意：审批只在发布前发生一次。若把 publish 也绑定同一 Environment，
  # 会要求第二次审批，因此 publish 使用普通仓库 Secret（无需审批）。
  # ---------------------------------------------------------------------------
  build-and-sign:
    name: Build & Sign Release APK
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      # 版本一致性：tag 必须等于 v<versionName>。
      #
      # 触发上下文差异（这里曾是一个真实缺陷）：
      #   * push tag          -> GITHUB_REF=refs/tags/v1.2.3, GITHUB_REF_NAME=v1.2.3
      #   * workflow_dispatch -> GITHUB_REF=refs/heads/main, GITHUB_REF_NAME=main
      # 早期实现直接取 GITHUB_REF_NAME，导致手动触发时永远拿分支名去比对，
      # 必然失败 —— 等于手动入口完全不可用。
      #
      # 现在：tag 推送时用真实 tag；手动触发时使用输入参数，留空则按
      # v<versionName> 推导。两种情况都要求最终 tag 与 versionName 一致，
      # 因为客户端按 tag 推导资产名（Go_<version>_arm64-v8a_release.apk），
      # 不一致会让自更新静默失效。
      - name: Assert tag matches versionName
        run: |
          set -euo pipefail
          VER=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle | head -n1)
          if [ -z "${VER}" ]; then
            echo "::error::无法从 app/build.gradle 解析 versionName"
            exit 1
          fi

          case "${GITHUB_REF}" in
            refs/tags/*)
              TAG="${GITHUB_REF_NAME}"
              echo "触发方式：tag 推送"
              ;;
            *)
              TAG="${{ inputs.tag }}"
              if [ -z "${TAG}" ]; then
                TAG="v${VER}"
              fi
              echo "触发方式：手动（GITHUB_REF_NAME=${GITHUB_REF_NAME} 不可用作版本）"
              ;;
          esac

          echo "tag=${TAG}  versionName=${VER}  期望 tag=v${VER}"
          if [ "${TAG}" != "v${VER}" ]; then
            echo "::error::tag (${TAG}) 与 versionName (${VER}) 不一致，应为 v${VER}"
            echo "::error::客户端按 tag 推导资产名，不一致会导致自更新无法匹配"
            exit 1
          fi
          echo "VERSION_NAME=${VER}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@9704b39bf258b59bc04b50fa2dd55e9ed76b47a8 # v4.1.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 从 Environment Secret 还原签名密钥库到 runner 临时目录。
      # 该文件随 runner 销毁，绝不进入仓库、缓存或 artifact。
      - name: Materialize signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64}" ]; then
            echo "::error::未配置 SIGNING_KEYSTORE_BASE64，拒绝以未签名方式发布"
            exit 1
          fi
          install -m 600 /dev/null "${RUNNER_TEMP}/release.p12"
          printf '%s' "${SIGNING_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.p12"

      - name: Record signing certificate fingerprint
        env:
          GOGOGO_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          GOGOGO_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore "${RUNNER_TEMP}/release.p12" \
            -storepass "${GOGOGO_KEYSTORE_PASSWORD}" \
            -alias "${GOGOGO_KEY_ALIAS}" \
            -storetype PKCS12 > "${RUNNER_TEMP}/keystore-info.txt"
          echo "### 签名证书指纹" >> "$GITHUB_STEP_SUMMARY"
          grep -E 'SHA256:|Alias name' "${RUNNER_TEMP}/keystore-info.txt" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build release (signed once by Gradle)
        env:
          GOGOGO_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          GOGOGO_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          GOGOGO_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          GOGOGO_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPS_SAFE_CODE: ${{ secrets.MAPS_SAFE_CODE }}
        run: |
          set -euo pipefail
          # secrets-gradle-plugin 从 local.properties 读取地图 Key
          printf 'MAPS_API_KEY=%s\nMAPS_SAFE_CODE=%s\n' "${MAPS_API_KEY}" "${MAPS_SAFE_CODE}" > local.properties
          chmod 600 local.properties
          ./gradlew assembleRelease --stacktrace

      - name: Assert APK is signed by the release key
        env:
          GOGOGO_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          GOGOGO_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK_DIR=$(dirname "${APK}")" >> "$GITHUB_ENV"
          echo "APK_NAME=$(basename "${APK}")" >> "$GITHUB_ENV"

          APKSIGNER=$(ls "${ANDROID_HOME}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)
          "${APKSIGNER}" verify --verbose --print-certs "${APK}" > "${RUNNER_TEMP}/apksigner.txt"
          cat "${RUNNER_TEMP}/apksigner.txt"
          grep -q 'Verified' "${RUNNER_TEMP}/apksigner.txt" \
            || { echo "::error::APK 签名校验失败"; exit 1; }

          # 仅有 'Verified' 只说明「被某个密钥签过」，不足以说明是我们的发布密钥。
          # 这里把 APK 的实际签名证书指纹与密钥库中的证书指纹比对，
          # 确保发布物由预期密钥签署（否则客户端 UpdateVerifier 会拒绝安装，
          # 用户看到的是「校验失败」而非静默降级）。
          APK_CERT=$(grep -m1 -i 'certificate SHA-256 digest' "${RUNNER_TEMP}/apksigner.txt" \
                     | sed 's/.*digest: //' | tr -d ':' | tr 'A-F' 'a-f')
          KS_CERT=$(keytool -list -v \
                      -keystore "${GOGOGO_KEYSTORE_FILE}" \
                      -storepass "${GOGOGO_KEYSTORE_PASSWORD}" \
                      -storetype PKCS12 2>/dev/null \
                    | grep -m1 -i 'SHA256:' | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK cert : ${APK_CERT}"
          echo "KS  cert : ${KS_CERT}"
          if [ -z "${APK_CERT}" ] || [ -z "${KS_CERT}" ] || [ "${APK_CERT}" != "${KS_CERT}" ]; then
            echo "::error::APK 签名证书与密钥库不匹配 —— 发布物并非由预期发布密钥签署"
            exit 1
          fi
          echo "CERT_SHA256=${APK_CERT}" >> "$GITHUB_ENV"
          echo "签名证书与密钥库一致：${APK_CERT}"

      - name: Generate checksums and release notes
        run: |
          set -euo pipefail
          cd "${APK_DIR}"
          sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          SUM=$(cut -d' ' -f1 "${APK_NAME}.sha256")
          CERT="${CERT_SHA256}"
          {
            echo "## 下载与校验"
            echo
            echo "APK：\`${APK_NAME}\`"
            echo
            echo '```'
            echo "SHA-256: ${SUM}"
            echo '```'
            echo
            echo "签名证书 SHA-256：\`${CERT}\`"
            echo
            echo "应用内自更新会强制校验 APK 的 SHA-256 与签名证书，任一不符即中止安装。"
          } > release-notes.md
          cat release-notes.md

      - name: Generate build provenance (in-toto / SLSA-style)
        env:
          GOGOGO_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          GOGOGO_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          cd "${APK_DIR}"
          APK_SHA=$(cut -d' ' -f1 "${APK_NAME}.sha256")

          # 生成 in-toto Statement / SLSA provenance v1 形式的本体。
          #
          # 实现说明：不使用 heredoc —— YAML run 块的内容带有缩进，而 <<EOF 的
          # 结束标记必须顶格（<<-EOF 只剥离制表符、不剥离空格），否则 shell 会
          # 一直读到文件结尾。改用仓库内的 Node 脚本，同时避免 jq 这类依赖
          # runner 预装工具的假设。
          #
          # 局限：本证明由发布签名密钥签署，属「同一信任根的自证」，强度低于
          # 独立的 Sigstore keyless 签名或云 KMS 身份证明。其价值在于把
          # 「源码提交 → 构建参数 → 制品哈希」绑定为不可单独篡改的一组记录。
          STARTED_ON=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
          APK_NAME="${APK_NAME}" \
          APK_SHA="${APK_SHA}" \
          RELEASE_TAG="${RELEASE_TAG}" \
          node scripts/gen-provenance.mjs > provenance.json

          node -e 'const d=require("./provenance.json"); if(!d.subject?.[0]?.digest?.sha256) { console.error("provenance 结构校验失败"); process.exit(1); } console.log("provenance 结构校验通过");'

          # 用发布密钥签名 provenance（先签名，再复制，避免自证被篡改）
          openssl pkcs12 -in "${GOGOGO_KEYSTORE_FILE}" \
            -passin env:GOGOGO_KEYSTORE_PASSWORD \
            -nocerts -nodes -out "${RUNNER_TEMP}/provenance-key.pem" 2>/dev/null
          openssl dgst -sha256 -sign "${RUNNER_TEMP}/provenance-key.pem" \
            -out provenance.json.sig provenance.json
          rm -f "${RUNNER_TEMP}/provenance-key.pem"

          echo "provenance.json 与 .sig 已生成："
          ls -la provenance.json provenance.json.sig

      - name: Upload signed APK
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
            app/build/outputs/apk/release/release-notes.md
            app/build/outputs/apk/release/provenance.json
            app/build/outputs/apk/release/provenance.json.sig
          retention-days: 30
          if-no-files-found: error

      - name: Clear signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/release.p12" "${RUNNER_TEMP}/provenance-key.pem" local.properties || true

  # ---------------------------------------------------------------------------
  # 发布。仅此作业需要 contents: write。
  #
  # 刻意不绑定 production Environment：审批已在 build-and-sign 发生过一次，
  # 再次绑定会导致发布阶段被要求第二次审批。本作业不接触任何签名凭据，
  # 只消费上一个作业产出的 artifact。
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: build-and-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-apk
          path: dist

      - name: Find release notes
        id: notes
        run: |
          set -euo pipefail
          NOTES=$(find dist -name 'release-notes.md' | head -n1)
          if [ -z "${NOTES}" ]; then echo "::error::缺少 release-notes.md"; exit 1; fi
          echo "path=${NOTES}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          draft: true          # 先生成草稿，人工复核校验值后再公开
          prerelease: false
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/*.apk
            dist/*.sha256
            dist/provenance.json
            dist/provenance.json.sig
