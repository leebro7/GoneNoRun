// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.1'
        // 注意：不再依赖 secrets-gradle-plugin。地图 Key 由 app/build.gradle
        // 通过 buildConfigField 注入，原因见该文件顶部说明。

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // -----------------------------------------------------------------------
    // 依赖校验与锁定（F-04）
    //
    // 修正说明：早期版本在这里写了 dependencyVerification { } 与
    // dependencyLocking { }，两者在 Project 上都不是合法方法，会导致
    // 配置阶段直接失败：
    //
    //   Could not find method dependencyVerification() ...
    //     at build.gradle:36
    //
    // Gradle 的实际机制是：
    //   * 依赖校验 —— 读取 gradle/verification-metadata.xml（若存在），
    //     并以 --dependency-verification=strict 开启严格模式；不需要 DSL。
    //   * 依赖锁定 —— 由 --write-locks 生成 gradle.lockfile，
    //     或对具体配置调用 Configuration#resolutionStrategy.activateDependencyLocking()。
    //
    // 因此这里不再声明任何东西。仓库内**尚未**提交 verification-metadata.xml
    // 与 gradle.lockfile（需 JDK 生成，见 docs/SECURITY-HARDENING.md §4 V-5/V-6）。
    // 生成后 Gradle 会自动使用，无需改本文件。
    // -----------------------------------------------------------------------

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile).tap {
            configureEach { // 用于显示过时 API 的详细信息
                options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
