plugins {
    id "com.android.application"
    // 谷歌官方推荐的用于隐藏地图 KEY 的插件
    // https://developers.google.com/maps/documentation/places/android-sdk/secrets-gradle-plugin
    id "com.google.android.libraries.mapsplatform.secrets-gradle-plugin"
}

// ---------------------------------------------------------------------------
// 签名凭据加载策略（零信任：仓库内不得存在任何签名凭据）
//
// 优先级：
//   1. 环境变量（CI 由受保护 Environment 的 Secret 注入）
//   2. keystore.properties（仅本地开发者使用，已在 .gitignore 中排除）
//
// 若两者都不存在，release 变体不签名；assembleRelease 仍可产出未签名 APK，
// 使 fork PR 的构建无需任何凭据即可完成安全校验。
// ---------------------------------------------------------------------------
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def signingValue = { String envName, String propName ->
    def v = System.getenv(envName)
    return (v != null && !v.trim().isEmpty()) ? v.trim() : signingProps.getProperty(propName)
}

android {
    ndkVersion = '26.2.11394342'
    compileSdk = 32
    buildToolsVersion = '36.0.0'
    namespace = 'com.zcshou.gogogo'

    // 签名配置仅在凭据齐备时创建；绝不写入明文
    signingConfigs {
        if (signingValue('GOGOGO_KEYSTORE_FILE', 'storeFile') != null) {
            release {
                storeFile file(signingValue('GOGOGO_KEYSTORE_FILE', 'storeFile'))
                storePassword signingValue('GOGOGO_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('GOGOGO_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('GOGOGO_KEY_PASSWORD', 'keyPassword')
                // 启用 v2/v3 签名方案，为后续密钥轮换留出空间
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    defaultConfig {
        applicationId "com.zcshou.gogogo"
        minSdkVersion 27
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 32
        versionCode 1123
        versionName '1.12.3' // https://semver.org/lang/zh-CN/
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['zh', 'zh-rCN', 'en', 'en-rUS']
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            multiDexEnabled = true
            // 显式绑定，不再经 defaultConfig 隐式继承，
            // 避免 debug 变体使用发布密钥
            if (signingConfigs.findByName('release') != null) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            // debug 变体仅使用 Android SDK 自动生成的调试密钥，绝不使用发布密钥
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            excludes += ['lib/armeabi/**']
        }
        resources {
            excludes += ['lib/armeabi/**']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // 指定输出文件名
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                def fileName
                if (variant.buildType.name == 'release') {
                    fileName = "Go_${defaultConfig.versionName}_arm64-v8a_release.apk"
                } else {
                    fileName = "Go_${defaultConfig.versionName}_arm64-v8a_debug.apk"
                }
                outputFileName = fileName
            }
        }
    }
}

// ---------------------------------------------------------------------------
// vendored 依赖完整性校验（F-04）
//
// Gradle 的 dependency locking / verification-metadata 无法覆盖 fileTree()
// 或 files() 引入的本地二进制，因此对 vendored 依赖单独做 SHA-256 白名单校验。
// 清单见 app/libs/VENDORED_DEPENDENCIES.sha256
// ---------------------------------------------------------------------------
tasks.register('verifyVendoredDependencies') {
    group = 'verification'
    description = '校验 vendored 二进制依赖（BaiduLBS_Android.jar / *.so）的 SHA-256'

    def libsDir = file('libs')
    def manifestFile = file('libs/VENDORED_DEPENDENCIES.sha256')

    outputs.upToDateWhen { false }

    doLast {
        if (!manifestFile.exists()) {
            throw new GradleException(
                "缺少 vendored 依赖校验清单: ${manifestFile}\n" +
                "请运行 scripts/gen-vendored-checksums.sh 生成后提交。")
        }
        def expected = [:]
        manifestFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.isEmpty() || trimmed.startsWith('#')) return
            def parts = trimmed.split(/\s+/, 2)
            if (parts.length == 2) expected[parts[1].trim()] = parts[0].trim().toLowerCase()
        }
        def failures = []
        expected.each { relPath, wantHash ->
            def f = new File(libsDir, relPath)
            if (!f.exists()) {
                failures << "缺失文件: ${relPath}".toString()
                return
            }
            def actual = java.security.MessageDigest.getInstance('SHA-256')
                    .digest(f.bytes).encodeHex().toString()
            if (actual != wantHash) {
                failures << "哈希不匹配: ${relPath}\n    期望 ${wantHash}\n    实际 ${actual}".toString()
            }
        }
        if (!failures.isEmpty()) {
            throw new GradleException("vendored 依赖完整性校验失败:\n  - " + failures.join("\n  - "))
        }
        logger.lifecycle("vendored 依赖校验通过（${expected.size()} 个文件）")
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn 'verifyVendoredDependencies'
}

dependencies {
    // 不再使用 fileTree 通配，改为精确声明，避免无意引入新增二进制
    implementation files('libs/BaiduLBS_Android.jar')
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.elvishew:xlog:1.11.1'
    implementation 'io.noties.markwon:core:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}
