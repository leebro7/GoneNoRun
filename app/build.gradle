plugins {
    id "com.android.application"
}

// ---------------------------------------------------------------------------
// 地图 Key 的注入方式（已移除 secrets-gradle-plugin）
//
// 原先使用 com.google.android.libraries.mapsplatform.secrets-gradle-plugin，
// 但它在 CI 上暴露出两个无法回避的问题（均来自实测诊断，非推测）：
//
//   1. local.properties 不存在时，项目**配置阶段**就失败：
//        The file .../local.properties could not be found
//      这使所有无密钥构建（fork PR、PR、手动构建）在编译前即告失败。
//   2. 键值为空字符串时生成非法 Java，编译失败：
//        BuildConfig.java:12: error: illegal start of expression
//          public static final String MAPS_API_KEY = ;
//
// 该插件的能力仅是为两个字符串生成 BuildConfig 字段，用 buildConfigField
// 即可等价实现，且行为完全可控。真实 Secret 由 CI 通过 local.properties
// 注入；缺失时使用非空占位，保证编译产物合法、构建不会因缺少密钥而中断。
//
// 读取优先级：local.properties（CI/本地） > 环境变量 > 非空占位
// ---------------------------------------------------------------------------
def readMapSecret = { String key ->
    // 1) local.properties（与 Gradle 约定的 SDK 路径文件同名，已在 .gitignore）
    def propsFile = rootProject.file('local.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def v = props.getProperty(key)
        if (v != null && !v.trim().isEmpty()) return v.trim()
    }
    // 2) 环境变量
    def env = System.getenv(key)
    if (env != null && !env.trim().isEmpty()) return env.trim()
    // 3) 非空占位 —— 空字符串会生成非法 Java 字面量
    return "PLACEHOLDER_${key}"
}
def mapsApiKey = readMapSecret('MAPS_API_KEY')
def mapsSafeCode = readMapSecret('MAPS_SAFE_CODE')

// ---------------------------------------------------------------------------
// 签名凭据加载策略（零信任：仓库内不得存在任何签名凭据）
//
// 优先级：
//   1. 环境变量（CI 由受保护 Environment 的 Secret 注入）
//   2. keystore.properties（仅本地开发者使用，已在 .gitignore 中排除）
//
// 若两者都不存在，release 变体不签名；assembleRelease 仍可产出未签名 APK，
// 使 fork PR 的构建无需任何凭据即可完成安全校验。
// ---------------------------------------------------------------------------
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def signingValue = { String envName, String propName ->
    def v = System.getenv(envName)
    return (v != null && !v.trim().isEmpty()) ? v.trim() : signingProps.getProperty(propName)
}

android {
    // 修正说明（依据 CI 实测诊断，而非推测）：
    //   * 原先声明 ndkVersion = '26.2.11394342'，但本模块**没有任何原生源码**
    //     （app/src 下无 .c/.cpp/CMakeLists.txt），.so 是已入库的预编译产物。
    //     该声明纯属多余，且在 NDK 未安装的 runner 上会直接报错。
    //   * 原先 compileSdk = 32，但 CI runner 预装的平台最低为 android-34，
    //     导致找不到 android-32 平台。buildToolsVersion 早已是 36.0.0，
    //     两者本来就不匹配。
    //   * 改动范围刻意收窄：只提升 compileSdk（影响编译期可用 API 与清单合并），
    //     **不动 targetSdk**（保持 32），避免改变运行时行为。
    compileSdk = 36
    buildToolsVersion = '36.0.0'
    namespace = 'com.zcshou.gogogo'

    // 签名配置仅在凭据齐备时创建；绝不写入明文
    signingConfigs {
        if (signingValue('GOGOGO_KEYSTORE_FILE', 'storeFile') != null) {
            release {
                storeFile file(signingValue('GOGOGO_KEYSTORE_FILE', 'storeFile'))
                storePassword signingValue('GOGOGO_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('GOGOGO_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('GOGOGO_KEY_PASSWORD', 'keyPassword')
                // 启用 v2/v3 签名方案，为后续密钥轮换留出空间
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    defaultConfig {
        applicationId "com.zcshou.gogogo"
        minSdkVersion 27
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 32
        versionCode 1123
        versionName '1.12.3' // https://semver.org/lang/zh-CN/
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resourceConfigurations += ['zh', 'zh-rCN', 'en', 'en-rUS']
        // 地图 Key 经 buildConfigField 注入（替代 secrets-gradle-plugin，
        // 原因见文件顶部说明）。值始终是非空字符串，保证 BuildConfig 合法。
        buildConfigField "String", "MAPS_API_KEY", "\"${mapsApiKey}\""
        buildConfigField "String", "MAPS_SAFE_CODE", "\"${mapsSafeCode}\""
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            multiDexEnabled = true
            // 显式绑定，不再经 defaultConfig 隐式继承，
            // 避免 debug 变体使用发布密钥
            if (signingConfigs.findByName('release') != null) {
                signingConfig = signingConfigs.release
            }
        }
        debug {
            // debug 变体仅使用 Android SDK 自动生成的调试密钥，绝不使用发布密钥
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    packagingOptions {
        jniLibs {
            excludes += ['lib/armeabi/**']
        }
        resources {
            excludes += ['lib/armeabi/**']
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    // 指定输出文件名
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                def fileName
                if (variant.buildType.name == 'release') {
                    fileName = "Go_${defaultConfig.versionName}_arm64-v8a_release.apk"
                } else {
                    fileName = "Go_${defaultConfig.versionName}_arm64-v8a_debug.apk"
                }
                outputFileName = fileName
            }
        }
    }
}

// ---------------------------------------------------------------------------
// vendored 依赖完整性校验（F-04）
//
// Gradle 的 dependency locking / verification-metadata 无法覆盖 fileTree()
// 或 files() 引入的本地二进制，因此对 vendored 依赖单独做 SHA-256 白名单校验。
// 清单见 app/libs/VENDORED_DEPENDENCIES.sha256
//
// 实现说明（两处都来自 CI 实测，不是推测）：
//
//  1. 委托给 sha256sum，而不是用 Gradle 自己重算哈希。早期版本用
//     MessageDigest + f.bytes 自行计算，CI 上失败而本地 `sha256sum -c` 通过
//     —— 出现了两套实现、只验证过其中一套。
//
//  2. 校验文件是否存在必须放在**配置期**，不能写进 doFirst 闭包：
//     本项目默认开启配置缓存（org.gradle.unsafe.configuration-cache=true），
//     而闭包内调用 file(...) 会引用 Gradle script 对象，直接报错：
//       Cannot reference a Gradle script object from a Groovy closure
//       as these are not supported with the configuration cache.
//     所以路径在配置期解析为普通 File 值，闭包只读该值。
// ---------------------------------------------------------------------------
def vendoredManifest = layout.projectDirectory.file('libs/VENDORED_DEPENDENCIES.sha256').asFile

tasks.register('verifyVendoredDependencies', Exec) {
    group = 'verification'
    description = '校验 vendored 二进制依赖（BaiduLBS_Android.jar / *.so）的 SHA-256'

    workingDir = layout.projectDirectory.dir('libs').asFile
    commandLine 'sha256sum', '-c', 'VENDORED_DEPENDENCIES.sha256'

    // 每次都执行：这是完整性校验，不应被 up-to-date 检查跳过
    outputs.upToDateWhen { false }

    doFirst {
        // 只引用配置期捕获的 File，不触碰 script 对象（配置缓存要求）
        if (!vendoredManifest.exists()) {
            throw new GradleException(
                "缺少 vendored 依赖校验清单: ${vendoredManifest}\n" +
                "请运行 scripts/gen-vendored-checksums.sh 生成后提交。")
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    dependsOn 'verifyVendoredDependencies'
}

dependencies {
    // 不再使用 fileTree 通配，改为精确声明，避免无意引入新增二进制
    implementation files('libs/BaiduLBS_Android.jar')
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.elvishew:xlog:1.11.1'
    implementation 'io.noties.markwon:core:4.6.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation('androidx.test.espresso:espresso-core:3.7.0', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
}
